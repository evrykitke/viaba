# The chart of accounts a workspace starts with.
#
# Inserted when Books is first enabled, with ON CONFLICT DO NOTHING against
# `accounts_number_key`. After that the workspace owns every row: a redeploy
# never puts back an account somebody deleted and never overwrites one they
# edited. A default is what you start with, not what you are held to.
#
# WHY IT IS EXHAUSTIVE
#
# The alternative is a starter set of thirty accounts, and the failure mode of a
# starter set is that the workspace discovers a missing account at the moment it
# is trying to post something. An unused account costs one row and one line in a
# picker that is searchable anyway. A missing one costs a posting failure and a
# phone call.
#
# So the accounts that starter charts leave out are deliberately here, and they
# are the ones a growing company hits first - see ADR 0006 sections 4, 6.2, 6.5
# and 7:
#
#   2010  goods received not invoiced   the three-way match cannot work without it
#   5090  landed cost absorbed          freight and duty into stock value, not expense
#   5230  purchase price variance       ordered price vs billed price, posted not absorbed
#   5200  inventory adjustment          and 5210-5250, so one bucket does not swallow every discrepancy
#   1240  inventory in transit          a transfer's third state, neither here nor there
#   8040  foreign exchange gain         and 8540 loss, held apart
#   8550  rounding differences          so a penny does not land in suspense
#   1170  input tax recoverable         held separately from 2100 output tax
#   1410  suspense                      because it is better to have one than to improvise one
#
# NUMBERS ARE A CONVENTION, TYPES ARE NOT
#
# `type` is what the software reasons about - it decides the normal balance,
# whether the balance closes at year end, and whether a sub-ledger owns the
# account. `number` decides only the order things are read in, and a workspace
# is free to renumber the whole chart. The ranges below are the usual ones:
#
#   1000-1999  assets            5000-5999  cost of sales
#   2000-2999  liabilities       6000-7999  operating expenses
#   3000-3999  equity            8000-8999  other income and expense
#   4000-4999  revenue           9000-9999  tax and appropriations
#
# Gaps between groups are intentional: a workspace inserting its own account
# next to a related one should not have to renumber to do it.

