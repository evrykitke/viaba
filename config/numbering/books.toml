# Document number series the `books` app declares.
#
# These are DEFAULTS. Installing the app inserts them into
# `core.number_sequences` with `ON CONFLICT DO NOTHING`; from that moment the
# tenant owns them, and a redeploy never puts back a format they changed.
#
# Everything here is validated when the file is read, at start-up - the mask
# parses, the label is a key the catalog actually holds, `start_at` is at least
# one. A format typo should stop a deployment, where somebody is watching, not
# the first invoice, in front of a customer.

[[series]]
doc_type = "sales_invoice"
label    = "books.doc_type.sales_invoice"

# `INV-{YYYY}-#####` renders `INV-2026-00042`.
#
# The year is in the number and the counter resets with the financial year, so
# an invoice number says which year it belongs to without anybody looking it
# up - and January's first invoice is number one without anything running at
# midnight. Five digits is a hundred thousand invoices in a year before the
# number widens, and widening is what it does rather than truncating.
mask     = "INV-{YYYY}-#####"
reset    = "fiscal_year"
start_at = 1

[[series]]
doc_type = "credit_note"
label    = "books.doc_type.credit_note"

# `CN-{YYYY}-#####` renders `CN-2026-00007`, and resets with the financial year
# for the reason the invoice series does. A series of its own rather than the
# invoice's: a credit note and the invoice it credits appearing as INV-00041 and
# INV-00042 is two documents nobody can tell apart in a list.
mask     = "CN-{YYYY}-#####"
reset    = "fiscal_year"
start_at = 1

[[series]]
doc_type = "payment"
label    = "books.doc_type.payment"

# `RCT-{YYYY}-#####` renders `RCT-2026-00042`. A receipt number, because that is
# what a customer is given for money handed over, and one that names its year
# for the reason an invoice number does.
#
# Allocated at POST, not at create: a draft somebody keyed off a bank statement
# and then abandoned must not leave a hole in a series an auditor reads.
mask     = "RCT-{YYYY}-#####"
reset    = "fiscal_year"
start_at = 1

[[series]]
doc_type = "journal"
label    = "books.doc_type.journal"

# `JNL-{YYYY}-#####` renders `JNL-2026-00042`. Same shape as an invoice and for
# the same reason: a journal number that names its year is one a person can file
# a working paper against without looking anything up.
#
# The counter resets with the financial year, which is also what makes a
# journal number stable evidence - JNL-2026-00042 is that year's forty-second
# posting and nothing else ever will be.
mask     = "JNL-{YYYY}-#####"
reset    = "fiscal_year"
start_at = 1
